# Nome da aplicação, usado pelo Spring nos logs
spring.application.name=api

# Porta HTTP em que a API atende (http://localhost:8080)
server.port=8080

# Conexão com o Oracle da FIAP (usuário e senha vêm de variáveis de ambiente, nunca do código)
# URL JDBC: usa a variável DB_URL se existir; senão, o padrão depois dos dois-pontos (servidor da FIAP, porta 1521, SID ORCL)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
# Usuário do banco, lido da variável de ambiente DB_USERNAME (obrigatória)
spring.datasource.username=${DB_USERNAME}
# Senha do banco, lida da variável de ambiente DB_PASSWORD (obrigatória)
spring.datasource.password=${DB_PASSWORD}
# Classe do driver JDBC do Oracle (vem da dependência ojdbc11)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O esquema é criado só pelas migrações do Flyway; o Hibernate apenas confere se as entidades batem com as tabelas
# validate: se uma entidade não bater com a tabela (nome, coluna ou tipo), a aplicação não sobe
spring.jpa.hibernate.ddl-auto=validate

# Migrações em src/main/resources/db/migration (V1__..., V2__...)
spring.flyway.locations=classpath:db/migration

# O esquema já tem tabelas de outros trabalhos: marca o estado atual como versão 0 e aplica a V1 em diante
# baseline-on-migrate: aceita um esquema que já tem tabelas, criando a flyway_schema_history com uma linha de baseline
spring.flyway.baseline-on-migrate=true
# baseline-version=0: o baseline fica na versão 0, então todas as migrações (V1 a V6) ainda são aplicadas
spring.flyway.baseline-version=0

# Decisão do modelo de IA (modelo_info.json): lacuna se p >= limiar; "a confirmar" se |p - limiar| < margem
# Limiar de probabilidade a partir do qual o conteúdo é considerado lacuna
aprendia.modelo.limiar-lacuna=0.40
# Distância do limiar dentro da qual o modelo fica em dúvida e o conteúdo vai para o professor confirmar
aprendia.modelo.margem-duvida=0.05
# Versão do modelo (modelo_info.json: versao_modelo), gravada em cada diagnóstico
aprendia.modelo.versao=2.0
